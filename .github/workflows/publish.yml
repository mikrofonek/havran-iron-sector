name: Publish HAVRAN
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: havran-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove private draft from public content
        if: hashFiles('docs/vyvoj/LINKEDIN.md') != ''
        run: |
          git rm docs/vyvoj/LINKEDIN.md
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('README.md')
          p.write_text(''.join(line for line in p.read_text().splitlines(keepends=True) if 'docs/vyvoj/LINKEDIN.md' not in line))
          p=Path('README.en.md')
          p.write_text(p.read_text().replace('[The development story](docs/vyvoj/pribeh-vyvoje.md) and [LinkedIn draft](docs/vyvoj/LINKEDIN.md) are also available.', '[The development story](docs/vyvoj/pribeh-vyvoje.md) is also available.'))
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.en.md
          git commit -m 'Remove private LinkedIn draft from public documentation'
          git push origin HEAD:main
          git tag -f v5.3.0
          git push --force origin refs/tags/v5.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run functional tests
        run: node havran-tests-5-3/run-tests.cjs
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/package_release.py
          git archive --format=tar HEAD | xz -6 > dist/havran-5-3-source.tar.xz
          (cd dist && sha256sum havran-5-3-source.tar.xz >> SHA256SUMS.txt)
          gh release upload v5.3.0 dist/*.zip dist/*.tar.xz dist/SHA256SUMS.txt --clobber
      - name: Build game website
        run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
